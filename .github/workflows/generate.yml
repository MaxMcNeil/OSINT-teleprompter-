name: Générer le script du live

on:
  workflow_dispatch:
    inputs:
      sujet:
        description: "Sujet du live (facultatif si tu donnes des titres ou une capture)"
        required: false
        default: ""
      titres:
        description: "Revue de presse : titres séparés par | (facultatif)"
        required: false
        default: ""
      capture:
        description: "Capture(s) d'écran des titres : tag de la Release qui les contient, ou « derniere » (vide = aucune)"
        required: false
        default: ""
      style:
        description: "Style du script"
        type: choice
        options:
          - expert
          - satirique
        default: expert
      duree:
        description: "Durée du live en minutes"
        required: true
        default: "20"
      these:
        description: "Thèse / angle à étayer (optionnel)"
        required: false
        default: ""
      langue:
        description: "Langue (auto, fr, en, es, de, it, pt, ar)"
        required: false
        default: "auto"
      reprendre:
        description: "Reprise d'un run coupé : auto = même sujet sans script (≤ 4 jours), non = tout refaire, ou nom du dossier prompter/"
        required: false
        default: "auto"
      miniature_seule:
        description: "Refaire SEULEMENT le document titre + miniature d'un live déjà écrit : nom (ou début) du dossier prompter/ — vide sinon"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # clés communes à la génération et au ciblage du Finder
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      # plusieurs clés possibles, séparées par des virgules (rotation automatique quand une clé est épuisée)
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GEMINI_API_KEYS_PLUS: ${{ secrets.GEMINI_API_KEYS_PLUS }}
      # relais IA gratuits (facultatifs, mêmes noms que dans Montage LV) : l'écriture passe par eux, la clé Gemini
      # est gardée pour la recherche Google, la citation, les captures et la miniature
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEYS_PLUS: ${{ secrets.GROQ_API_KEYS_PLUS }}
      CEREBRAS_API_KEYS: ${{ secrets.CEREBRAS_API_KEYS }}
      OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
      LLM_PRIORITE: relais
      YT_API_KEY: ${{ secrets.YT_API_KEY }}
      YT_API_KEYS: ${{ secrets.YT_API_KEYS }}
      YOUTUBE_API_KEYS_PLUS: ${{ secrets.YOUTUBE_API_KEYS_PLUS }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Repère de début (pour retrouver le dossier de CE run)
        run: touch "$RUNNER_TEMP/debut"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Capture(s) d'écran des titres (Release)
        if: inputs.capture != ''
        continue-on-error: true      # capture introuvable : le run continue avec les titres/sujet tapés (et le dit)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.capture }}
        run: |
          mkdir -p "$RUNNER_TEMP/captures"
          T="$TAG"
          case "$(echo "$T" | tr '[:upper:]' '[:lower:]')" in derniere|dernière|latest|last) T="";; esac
          for p in '*.jpg' '*.jpeg' '*.png' '*.webp' '*.JPG' '*.JPEG' '*.PNG' '*.WEBP'; do
            gh release download $T -R "$GITHUB_REPOSITORY" -p "$p" -D "$RUNNER_TEMP/captures" --clobber 2>/dev/null || true
          done
          ls -la "$RUNNER_TEMP/captures"
          n=$(find "$RUNNER_TEMP/captures" -type f | wc -l)
          if [ "$n" -eq 0 ]; then echo "::warning::Aucune image trouvée dans la Release « $TAG » : le script se base sur les titres/sujet tapés"; fi
      - name: Générer
        timeout-minutes: 63
        env:
          PYTHONUTF8: "1"
          DEADLINE_MIN: "55"
          # arrêt de sécurité à 60 min (l'étape est coupée à 63) : le script déjà écrit est enregistré, jamais perdu
          HARD_STOP_MIN: "60"
          LLM_CALL_TIMEOUT_S: "240"
          PYTHONUNBUFFERED: "1"
          LLM_RPM: "4"
          SUJET: ${{ inputs.sujet }}
          TITRES: ${{ inputs.titres }}
          STYLE: ${{ inputs.style || 'expert' }}
          CAPTURES: ${{ inputs.capture != '' && format('{0}/captures', runner.temp) || '' }}
          DUREE: ${{ inputs.duree }}
          THESE: ${{ inputs.these }}
          LANGUE: ${{ inputs.langue }}
          REPRENDRE: ${{ inputs.reprendre || 'auto' }}
          MINIATURE_SEULE: ${{ inputs.miniature_seule }}
          JOURNAL: ${{ runner.temp }}/journal.txt
          OUT_DIR: prompter
        run: python -m src.main --sujet "$SUJET" --titres "$TITRES" --captures "$CAPTURES" --style "$STYLE" --duree "$DUREE" --these "$THESE" --langue "$LANGUE"
      # 🔒 Vid-o-presse-finder n'est plus lancé automatiquement (Gemini réservé au script) : tu fournis toi-même
      #    articles, vidéos et photos au montage.
      - name: Enregistrer les fichiers dans prompter/ (branche main)
        if: always()
        env:
          SUJET: ${{ inputs.sujet || inputs.titres || 'revue de presse (capture)' }}
          OUT_DIR: prompter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$OUT_DIR"
          # journal horodaté du run, rangé avec ses résultats (diagnostic même si le run a été coupé)
          D=$(find "$OUT_DIR" -mindepth 2 -maxdepth 2 \( -name requete.json -o -name donnees.json \) -newer "$RUNNER_TEMP/debut" -printf '%T@ %h\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-)
          if [ -s "$RUNNER_TEMP/journal.txt" ]; then
            if [ -n "$D" ]; then cp "$RUNNER_TEMP/journal.txt" "$D/journal.txt"
            else mkdir -p "$OUT_DIR/_journaux" && cp "$RUNNER_TEMP/journal.txt" "$OUT_DIR/_journaux/$(date -u +%Y-%m-%d_%Hh%M)_run${GITHUB_RUN_ID}.txt"; fi
          fi
          git add -A "$OUT_DIR" || true
          if git diff --cached --quiet; then echo "Rien à enregistrer"; exit 0; fi
          git commit -m "prompter: $SUJET"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
