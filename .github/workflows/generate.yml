name: Générer le script du live

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Type de script : live (sujet, titres, capture) · commentaire d'une vidéo = ⚠ la vidéo à commenter va dans GOOGLE DRIVE → dossier « montage-joints » (PAS dans Releases) : la plus lourde du dossier est prise, hors ta vidéo « moi… », jamais supprimée ni déplacée"
        type: choice
        options:
          - live
          - commentaire d'une vidéo
        default: live
      video_commentee:
        description: "Mode commentaire : VIDE = la vidéo est prise toute seule dans GOOGLE DRIVE → montage-joints (PAS dans Releases). Sinon : nom d'un fichier de montage-joints (rempli tout seul par le partage Termux), ou lien direct (.mp4…) — ⚠ avec un lien, dépose AUSSI la vidéo dans montage-joints : le Montage la lit là"
        required: false
        default: ""
      sujet:
        description: "Sujet du live (facultatif si tu donnes des titres ou une capture)"
        required: false
        default: ""
      titres:
        description: "Revue de presse : titres séparés par | (facultatif)"
        required: false
        default: ""
      capture:
        description: "Capture(s) d'écran des titres : tag de la Release qui les contient, ou « derniere » (vide = aucune)"
        required: false
        default: ""
      style:
        description: "Style du script"
        type: choice
        options:
          - expert
          - satirique
        default: expert
      duree:
        description: "Durée du live en minutes"
        required: true
        default: "20"
      these:
        description: "Thèse / angle à étayer (optionnel)"
        required: false
        default: ""
      langue:
        description: "Langue de TON script (auto, fr, en, es, de, it, pt, ar). Commentaire d'une vidéo : auto = français, quelle que soit la langue de la vidéo commentée (passages en VO, traduits pour toi dans le script)"
        required: false
        default: "auto"
      reprendre:
        description: "Reprise d'un run coupé : auto = même sujet sans script (≤ 4 jours), non = tout refaire, ou nom du dossier prompter/"
        required: false
        default: "auto"
      miniature_seule:
        description: "Refaire SEULEMENT le document titre + miniature d'un live déjà écrit : nom (ou début) du dossier prompter/ — vide sinon"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    env:
      # clés communes à la génération et au ciblage du Finder
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      # plusieurs clés possibles, séparées par des virgules (rotation automatique quand une clé est épuisée)
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GEMINI_API_KEYS_PLUS: ${{ secrets.GEMINI_API_KEYS_PLUS }}
      # relais IA gratuits (facultatifs, mêmes noms que dans Montage LV) : l'écriture passe par eux, la clé Gemini
      # est gardée pour la recherche Google, la citation, les captures et la miniature
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEYS_PLUS: ${{ secrets.GROQ_API_KEYS_PLUS }}
      CEREBRAS_API_KEYS: ${{ secrets.CEREBRAS_API_KEYS }}
      OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
      LLM_PRIORITE: relais
      YT_API_KEY: ${{ secrets.YT_API_KEY }}
      YT_API_KEYS: ${{ secrets.YT_API_KEYS }}
      YOUTUBE_API_KEYS_PLUS: ${{ secrets.YOUTUBE_API_KEYS_PLUS }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Repère de début (pour retrouver le dossier de CE run)
        run: touch "$RUNNER_TEMP/debut"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # ---------------- mode « commentaire d'une vidéo » : la vidéo est LUE dans Drive montage-joints (copie locale) ----
      - name: Commentaire — trouver et lire la vidéo à commenter (Drive montage-joints, lecture seule)
        if: startsWith(inputs.mode, 'commentaire')
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          DOSSIER: montage-joints
          LIEN: ${{ inputs.video_commentee }}
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg; }
          pip install -q "faster-whisper>=1.1,<2" || echo "::notice::transcription locale indisponible : Groq seulement"
          # accès Drive : pour lire la vidéo, et pour y déposer la liste des passages que le Montage lira
          R=""
          if [ -n "$RCLONE_CONF" ]; then
            for i in 1 2 3; do command -v rclone >/dev/null && break; curl -sSf --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null 2>&1 || sleep 5; done
            mkdir -p ~/.config/rclone && printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
            R=$(grep -m1 -oE '^\[[^]]+\]' ~/.config/rclone/rclone.conf | tr -d '[]')
            echo "DRIVE_DEST=$R:$DOSSIER" >> "$GITHUB_ENV"
          fi
          mkdir -p "$RUNNER_TEMP/commentee"
          case "$LIEN" in http*) ;; *)
            if [ -n "$LIEN" ]; then    # nom d'un fichier de montage-joints (partage Termux) : CETTE vidéo, pas la plus lourde
              [ -n "$R" ] || { echo "::error title=Accès Drive manquant::secret RCLONE_CONF absent : impossible de lire « $LIEN » dans Drive."; exit 1; }
              NOM="$(basename "$LIEN")"
              rclone copyto "$R:$DOSSIER/$NOM" "$RUNNER_TEMP/commentee/$NOM" --retries 5 -q \
                || { echo "::error title=Vidéo introuvable::« $NOM » absent du dossier Drive « $DOSSIER »."; exit 1; }
              { echo "VIDEO_COMMENTEE=$RUNNER_TEMP/commentee/$NOM"; echo "VIDEO_COMMENTEE_NOM=$NOM"; } >> "$GITHUB_ENV"
              echo "### 🎬 Vidéo commentée : $NOM (Drive « $DOSSIER », laissée en place)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi ;;
          esac
          if [ -n "$LIEN" ]; then      # lien direct donné au lancement : téléchargé, rien n'est touché sur Drive
            NOM=$(basename "${LIEN%%\?*}"); case "$NOM" in *.*) ;; *) NOM="video-commentee.mp4";; esac
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/commentee/$NOM" "$LIEN" || { echo "::error::vidéo introuvable au lien donné"; exit 1; }
            { echo "VIDEO_COMMENTEE=$RUNNER_TEMP/commentee/$NOM"; echo "VIDEO_COMMENTEE_NOM=$NOM"; } >> "$GITHUB_ENV"
            echo "### 🎬 Vidéo commentée : $NOM (lien donné au lancement)" >> "$GITHUB_STEP_SUMMARY"
            [ -n "$R" ] || echo "::warning title=Accès Drive manquant::la liste des passages ne sera pas déposée dans Drive pour le Montage (secret RCLONE_CONF absent)."
            exit 0
          fi
          [ -n "$R" ] || { echo "::error title=Accès Drive manquant::Ajoute le secret RCLONE_CONF à ce dépôt (commande Termux dans le README, section « Mode commentaire »), ou donne un lien dans « video_commentee »."; exit 1; }
          # la vidéo à commenter = la PLUS LOURDE vidéo du dossier, hors ta vidéo « moi… » (aucun nom à respecter)
          NOM=$(rclone lsjson "$R:$DOSSIER" --files-only 2>/dev/null | python3 -c '
          import json, re, sys
          v = [f for f in json.load(sys.stdin) if re.search(r"\.(mp4|mov|mkv|webm|m4v|avi)$", f["Name"], re.I)
               and not f["Name"].lower().startswith("moi")]
          print(max(v, key=lambda f: f["Size"])["Name"] if v else "")')
          [ -n "$NOM" ] || { echo "::error title=Aucune vidéo à commenter::Dépose la vidéo à commenter dans ton dossier Drive « $DOSSIER » (n'importe quel nom, sauf « moi… »)."; exit 1; }
          rclone copyto "$R:$DOSSIER/$NOM" "$RUNNER_TEMP/commentee/$NOM" --retries 5 -q
          { echo "VIDEO_COMMENTEE=$RUNNER_TEMP/commentee/$NOM"; echo "VIDEO_COMMENTEE_NOM=$NOM"; } >> "$GITHUB_ENV"
          echo "### 🎬 Vidéo commentée : $NOM (lue dans Drive « $DOSSIER », laissée en place)" >> "$GITHUB_STEP_SUMMARY"

      - name: Capture(s) d'écran des titres (Release)
        if: inputs.capture != ''
        continue-on-error: true      # capture introuvable : le run continue avec les titres/sujet tapés (et le dit)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.capture }}
        run: |
          mkdir -p "$RUNNER_TEMP/captures"
          T="$TAG"
          case "$(echo "$T" | tr '[:upper:]' '[:lower:]')" in derniere|dernière|latest|last) T="";; esac
          for p in '*.jpg' '*.jpeg' '*.png' '*.webp' '*.JPG' '*.JPEG' '*.PNG' '*.WEBP'; do
            gh release download $T -R "$GITHUB_REPOSITORY" -p "$p" -D "$RUNNER_TEMP/captures" --clobber 2>/dev/null || true
          done
          ls -la "$RUNNER_TEMP/captures"
          n=$(find "$RUNNER_TEMP/captures" -type f | wc -l)
          if [ "$n" -eq 0 ]; then echo "::warning::Aucune image trouvée dans la Release « $TAG » : le script se base sur les titres/sujet tapés"; fi
      - name: Générer
        timeout-minutes: 118
        env:
          PYTHONUTF8: "1"
          DEADLINE_MIN: "55"
          # live long : délai allongé tout seul (20 min → 55 min de run, 30 → 75, plafond 110) ; arrêt de sécurité 5 min après
          DEADLINE_AUTO: "1"
          # arrêt de sécurité (60 min, ou délai auto + 5) avant la coupure de l'étape : le script déjà écrit est enregistré, jamais perdu
          HARD_STOP_MIN: "60"
          LLM_CALL_TIMEOUT_S: "240"
          PYTHONUNBUFFERED: "1"
          LLM_RPM: "4"
          SUJET: ${{ inputs.sujet }}
          TITRES: ${{ inputs.titres }}
          STYLE: ${{ inputs.style || 'expert' }}
          CAPTURES: ${{ inputs.capture != '' && format('{0}/captures', runner.temp) || '' }}
          DUREE: ${{ inputs.duree }}
          THESE: ${{ inputs.these }}
          LANGUE: ${{ inputs.langue }}
          REPRENDRE: ${{ inputs.reprendre || 'auto' }}
          MINIATURE_SEULE: ${{ inputs.miniature_seule }}
          JOURNAL: ${{ runner.temp }}/journal.txt
          OUT_DIR: prompter
          MODE: ${{ inputs.mode }}
        run: python -m src.main --sujet "$SUJET" --titres "$TITRES" --captures "$CAPTURES" --style "$STYLE" --duree "$DUREE" --these "$THESE" --langue "$LANGUE"
      # 🔒 Vid-o-presse-finder n'est plus lancé automatiquement (Gemini réservé au script) : tu fournis toi-même
      #    articles, vidéos et photos au montage.
      # le Montage (mode commentaire) lit ce fichier : la liste exacte des passages, dans l'ordre de tes « écoutez ça »
      - name: Commentaire — déposer la liste des passages pour le Montage (Drive montage-joints)
        # un essai lancé sur une BRANCHE ne dépose rien dans ton Drive (ton vrai montage-joints reste intact)
        if: success() && startsWith(inputs.mode, 'commentaire') && env.DRIVE_DEST != '' && github.ref_name == 'main'
        run: |
          P=$(find prompter -mindepth 2 -maxdepth 2 -name passages.json -newer "$RUNNER_TEMP/debut" | head -1)
          [ -n "$P" ] || { echo "::error::passages.json introuvable"; exit 1; }
          rclone copyto "$P" "$DRIVE_DEST/commentaire-passages.json" -q
          echo "✅ Liste des passages déposée dans Drive : commentaire-passages.json (le Montage la lit tout seul)." >> "$GITHUB_STEP_SUMMARY"

      - name: Enregistrer les fichiers dans prompter/ (branche main)
        if: always()
        env:
          SUJET: ${{ inputs.sujet || inputs.titres || 'revue de presse (capture)' }}
          OUT_DIR: prompter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$OUT_DIR"
          # journal horodaté du run, rangé avec ses résultats (diagnostic même si le run a été coupé)
          D=$(find "$OUT_DIR" -mindepth 2 -maxdepth 2 \( -name requete.json -o -name donnees.json \) -newer "$RUNNER_TEMP/debut" -printf '%T@ %h\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-)
          if [ -s "$RUNNER_TEMP/journal.txt" ]; then
            if [ -n "$D" ]; then cp "$RUNNER_TEMP/journal.txt" "$D/journal.txt"
            else mkdir -p "$OUT_DIR/_journaux" && cp "$RUNNER_TEMP/journal.txt" "$OUT_DIR/_journaux/$(date -u +%Y-%m-%d_%Hh%M)_run${GITHUB_RUN_ID}.txt"; fi
          fi
          git add -A "$OUT_DIR" || true
          if git diff --cached --quiet; then echo "Rien à enregistrer"; exit 0; fi
          git commit -m "prompter: $SUJET"
          for i in 1 2 3; do
            # lancé depuis une branche d'essai : les fichiers restent sur cette branche (main n'est jamais touché)
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1
