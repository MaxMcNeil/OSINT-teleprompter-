name: Générer le script du live

on:
  workflow_dispatch:
    inputs:
      sujet:
        description: "Sujet du live"
        required: true
      duree:
        description: "Durée du live en minutes"
        required: true
        default: "20"
      these:
        description: "Thèse / angle à étayer (optionnel)"
        required: false
        default: ""
      langue:
        description: "Langue (auto, fr, en, es, de, it, pt, ar)"
        required: false
        default: "auto"
      reprendre:
        description: "Reprise d'un run coupé : auto = même sujet sans script (≤ 4 jours), non = tout refaire, ou nom du dossier prompter/"
        required: false
        default: "auto"
      miniature_seule:
        description: "Refaire SEULEMENT titre + miniature d'un live déjà écrit : nom (ou début) du dossier prompter/ — vide sinon"
        required: false
        default: ""
      video_finder:
        description: "Lancer ensuite Vid-o-presse-finder, ciblé sur ce sujet (vidéos + articles pour le montage)"
        type: choice
        options: [oui, non]
        default: oui

permissions:
  contents: write

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # clés communes à la génération et au ciblage du Finder
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      # plusieurs clés possibles, séparées par des virgules (rotation automatique quand une clé est épuisée)
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GEMINI_API_KEYS_PLUS: ${{ secrets.GEMINI_API_KEYS_PLUS }}
      YT_API_KEY: ${{ secrets.YT_API_KEY }}
      YT_API_KEYS: ${{ secrets.YT_API_KEYS }}
      YOUTUBE_API_KEYS_PLUS: ${{ secrets.YOUTUBE_API_KEYS_PLUS }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      # génération de l'image de miniature (gratuit) : Cloudflare Workers AI d'abord, puis Hugging Face, Gemini, Pollinations
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Repère de début (pour retrouver le dossier de CE run)
        run: touch "$RUNNER_TEMP/debut"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Générer
        timeout-minutes: 63
        env:
          PYTHONUTF8: "1"
          DEADLINE_MIN: "55"
          # arrêt de sécurité à 60 min (l'étape est coupée à 63) : le script déjà écrit est enregistré, jamais perdu
          HARD_STOP_MIN: "60"
          LLM_CALL_TIMEOUT_S: "240"
          PYTHONUNBUFFERED: "1"
          LLM_RPM: "4"
          SUJET: ${{ inputs.sujet }}
          DUREE: ${{ inputs.duree }}
          THESE: ${{ inputs.these }}
          LANGUE: ${{ inputs.langue }}
          REPRENDRE: ${{ inputs.reprendre || 'auto' }}
          MINIATURE_SEULE: ${{ inputs.miniature_seule }}
          JOURNAL: ${{ runner.temp }}/journal.txt
          OUT_DIR: prompter
        run: python -m src.main --sujet "$SUJET" --duree "$DUREE" --these "$THESE" --langue "$LANGUE"
      # 🔎 Vid-o-presse-finder : recherches ciblées sur CE sujet (personnes qui ont parlé, cibles, points du script).
      # Lancé par ce run uniquement (aucun cron). Le lot du Finder garde ORIGINE.json -> le montage s'y synchronise.
      - name: Vid-o-presse-finder — préparer les recherches ciblées
        id: vpf
        if: always() && inputs.video_finder != 'non' && inputs.miniature_seule == ''
        continue-on-error: true
        timeout-minutes: 10
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          DEADLINE_MIN: "6"
          LLM_RPM: "4"
          FINDER_MAX: "5"
        run: |
          D=$(find prompter -mindepth 2 -maxdepth 2 -name requete.json -newer "$RUNNER_TEMP/debut" -printf '%T@ %h\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-)
          if [ -z "$D" ]; then
            echo "::warning::Vid-o-presse-finder non lancé : ce run n'a produit aucune recherche exploitable (voir l'étape Générer)"
            exit 0
          fi
          echo "dossier=$D" >> "$GITHUB_OUTPUT"
          set +e
          python -m src.finder_link "$D" "$RUNNER_TEMP/finder_payload.json"
          rc=$?
          set -e
          if [ "$rc" = 0 ] && [ -s "$RUNNER_TEMP/finder_payload.json" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"
          else echo "::warning::Vid-o-presse-finder non lancé : aucune recherche ciblée possible pour ce sujet"; fi

      - name: Vid-o-presse-finder — jeton GitHub App
        id: vpf_tok
        if: always() && steps.vpf.outputs.ok == '1' && vars.CHAINE_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CHAINE_APP_ID }}
          private-key: ${{ secrets.CHAINE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Vid-o-presse-finder

      - name: Vid-o-presse-finder — lancer
        if: always() && steps.vpf.outputs.ok == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.vpf_tok.outputs.token || secrets.CHAINE_TOKEN || secrets.FINDER_TOKEN }}
          CIBLE: ${{ vars.FINDER_REPO || format('{0}/Vid-o-presse-finder', github.repository_owner) }}
          D: ${{ steps.vpf.outputs.dossier }}
        run: |
          note() { printf '\n%s\n' "$1" >> "$D/FINDER.md"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          if [ -z "${GH_TOKEN:-}" ]; then
            note "❌ **Finder NON lancé** : aucun jeton. Ajoute le secret CHAINE_TOKEN (même jeton que la chaîne, droit « Contents : read and write » sur Vid-o-presse-finder) dans ce dépôt. Les recherches ci-dessus sont prêtes : colle-les dans le champ « recherches » de Find quotes."
            echo "::warning::Vid-o-presse-finder non lancé : secret CHAINE_TOKEN absent dans ce dépôt"
            exit 0
          fi
          for i in 1 2 3 4; do
            if gh api "repos/$CIBLE/dispatches" --input "$RUNNER_TEMP/finder_payload.json" >/dev/null 2>"$RUNNER_TEMP/vpf.err"; then
              note "✅ **Finder lancé** sur [$CIBLE](https://github.com/$CIBLE/actions/workflows/find-quotes.yml) — $(date -u '+%Y-%m-%d %H:%M') UTC. Le lot portera ORIGINE.json → ce dossier."
              exit 0
            fi
            echo "::warning::lancement du Finder : essai $i échoué ($(tail -1 "$RUNNER_TEMP/vpf.err"))"; sleep $((i * 10))
          done
          note "❌ **Finder NON lancé** : $(tail -1 "$RUNNER_TEMP/vpf.err" | cut -c1-200). Le jeton a-t-il « Contents : read and write » sur Vid-o-presse-finder ? Recherches prêtes ci-dessus (champ « recherches » de Find quotes)."
          echo "::warning::Vid-o-presse-finder non lancé (voir FINDER.md)"

      - name: Enregistrer les fichiers dans prompter/ (branche main)
        if: always()
        env:
          SUJET: ${{ inputs.sujet }}
          OUT_DIR: prompter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$OUT_DIR"
          # journal horodaté du run, rangé avec ses résultats (diagnostic même si le run a été coupé)
          D=$(find "$OUT_DIR" -mindepth 2 -maxdepth 2 \( -name requete.json -o -name donnees.json \) -newer "$RUNNER_TEMP/debut" -printf '%T@ %h\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-)
          if [ -s "$RUNNER_TEMP/journal.txt" ]; then
            if [ -n "$D" ]; then cp "$RUNNER_TEMP/journal.txt" "$D/journal.txt"
            else mkdir -p "$OUT_DIR/_journaux" && cp "$RUNNER_TEMP/journal.txt" "$OUT_DIR/_journaux/$(date -u +%Y-%m-%d_%Hh%M)_run${GITHUB_RUN_ID}.txt"; fi
          fi
          git add -A "$OUT_DIR" || true
          if git diff --cached --quiet; then echo "Rien à enregistrer"; exit 0; fi
          git commit -m "prompter: $SUJET"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
